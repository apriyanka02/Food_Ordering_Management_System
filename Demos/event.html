<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="btn">clickMe</button>
    <button id="btn1">clickhere</button>

    <button id="btn2">OnClick</button>
 <script>
   let test=document.getElementById("btn");
   test.addEventListener("click",function(){
    console.log("Button Clicked")
   });

   let test1=document.getElementById("btn1");
   test1.addEventListener("mouseover",function(){
    console.log("MouseOver Demo")
   });

   document.getElementById("btn2").onclick=function()
   {
     console.log("button clicked using onclick");
   };
    </script>

    <script>

    </script>
</body>
</html>
