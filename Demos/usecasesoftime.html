<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       let timer = setInterval(() => {
    console.log("Updating remaining time...");
}, 1000);

let autoSave = setInterval(() => {
    console.log("Saving student work...");
}, 5000);

let autoClose = setTimeout(() => {
    console.log("Assignment submission closed!");
    clearInterval(timer);
    clearInterval(autoSave);
}, 30000);

function closeAssignmentEarly() {
    console.log("Teacher closed submission!");

    clearTimeout(autoClose);
    clearInterval(timer);
    clearInterval(autoSave);
}
    </script>
</body>
</html>
