
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Images</title>

    <style>

        body{
            text-align: center;
            font-family: Arial;
        }

        .container{
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }

        img{
            width: 250px;
            height: 250px;
            border-radius: 10px;
            object-fit: cover;
        }

        button{
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }

    </style>
</head>

<body>

    <h1>Random Dog Images</h1>

    <button id="btn">Load Images</button>

    <div class="container"></div>

    <script>

        document.querySelector("#btn").addEventListener("click", () => {

            let container = document.querySelector(".container");

            container.innerHTML = "";

            fetch("https://dog.ceo/api/breeds/image/random/1")

                .then((res) => res.json())

                .then((result) => {

                    result.message.forEach((imgUrl) => {
                        let img = document.createElement("img");
                        img.src = imgUrl;
                        container.appendChild(img);
                    });
                })
                .catch((err) => {

                    console.log("Image cannot be loaded");

                });

        });

    </script>

</body>

</html>
